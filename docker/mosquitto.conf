# Dynamic Security: every client needs an account; accounts and ACLs are managed through
# $CONTROL/dynamic-security/v1 (scripts/broker-bootstrap.sh, go run ./cmd/provision).
per_listener_settings false
allow_anonymous false

plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

# Internal: backend, tests, provisioning CLI. Never published beyond this host / docker network, but accounts are global: every account is valid on both listeners.
listener 1883

# Devices (Q161 Pro, ssl=1).
listener 8883
certfile /mosquitto/certs/broker.crt
keyfile  /mosquitto/certs/broker.key

persistence true
persistence_location /mosquitto/data/
log_dest stdout
